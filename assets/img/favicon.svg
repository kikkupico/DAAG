<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The Chamber: a rotunda under a stone dome, open doorways all round the drum -->
  <rect x="1" y="1" width="62" height="62" rx="12" fill="#2e88b5" stroke="#1c1512" stroke-width="2"/>
  <g stroke="#1c1512" stroke-width="2.5" stroke-linejoin="round">
    <!-- dome and finial -->
    <path d="M13 31 A19 17 0 0 1 51 31 Z" fill="#eae4d4"/>
    <rect x="29.5" y="10" width="5" height="5" rx="1" fill="#eae4d4"/>
    <!-- drum -->
    <rect x="11" y="31" width="42" height="17" fill="#eae4d4"/>
    <!-- steps -->
    <rect x="7" y="48" width="50" height="5" fill="#eae4d4"/>
    <rect x="4" y="53" width="56" height="5" fill="#eae4d4"/>
  </g>
  <!-- doorways -->
  <g fill="#1c1512">
    <path d="M16 48 V39 a3 3 0 0 1 6 0 V48 Z"/>
    <path d="M29 48 V39 a3 3 0 0 1 6 0 V48 Z"/>
    <path d="M42 48 V39 a3 3 0 0 1 6 0 V48 Z"/>
  </g>
</svg>
