name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Only the pages and what they load are published. Sources, scripts, notes and the
      # tutor's server stay in the repository; a page that starts loading a new file from
      # scroll/ needs that file added here. The last line lets a reader write notes of their
      # own on any page, kept in their browser.
      - name: Gather the site
        run: |
          mkdir -p _site/scroll
          cp index.html landing.css landing.js hellenistic-reference.html .nojekyll _site/
          cp -r books places papers assets _site/
          cp scroll/shell.css scroll/shell.js scroll/place.css _site/scroll/
          python3 tutor/web.py _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
