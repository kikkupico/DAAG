<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1512">
<title>Feed</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231c1512'/%3E%3Cpath d='M6 22h20M6 15h20M6 8h20' stroke='%23e0b84a' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header id="bar">
    <span class="st" id="st-streak" title="Right answers in a row"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg><b>0</b><span class="sr"> in a row</span></span>
    <span class="st" id="st-today" title="Cards today"><b>0</b> today</span>
    <span class="st" id="st-met" title="Books met so far"><b>0</b> of 18 books</span>
    <span class="live" id="live" data-s="away" role="status"><i class="dot"></i><span id="live-t">not listening</span></span>
    <button class="sv" id="savedbtn" type="button" aria-label="Saved cards" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg><b>0</b></button>
  </header>
  <main id="feed" aria-label="The feed"></main>
  <aside id="drawer" aria-label="Saved cards" aria-hidden="true">
    <div class="dh"><h2>Saved</h2><button type="button" id="drawer-x" aria-label="Close the saved cards"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <ul id="saved-list"></ul>
    <p id="saved-none">Nothing saved yet. Tap the bookmark on a card to keep it here.</p>
    <div id="viewer" hidden></div>
  </aside>
  <div id="announce" class="sr" aria-live="polite"></div>
</div>
<script src="figures.js"></script>
<script src="app.js"></script>
</body>
</html>
